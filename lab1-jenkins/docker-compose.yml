# ============================================================
# LAB 1 — OWASP Juice Shop + Jenkins
# Réseau isolé : 172.20.0.0/24
# ============================================================
# Démarrage : docker compose up -d
# Arrêt     : docker compose down -v
# ============================================================

networks:
  lab1-net:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  jenkins_home:

services:

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    restart: unless-stopped
    networks:
      lab1-net:
        ipv4_address: 172.20.0.10
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000 > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root
    networks:
      lab1-net:
        ipv4_address: 172.20.0.20
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/lab/scripts:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    depends_on:
      juiceshop:
        condition: service_healthy
